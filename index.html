<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد ميلاد سعيد يا آيووش! ✨</title>
    <!-- مكتبة الألعاب النارية والقصاصات الفخمة -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            background: radial-gradient(circle at center, #ffebee 0%, #fce4ec 100%);
            font-family: 'Tahoma', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        /* رسالة تنبيه تفاعلية خفيفة لإجبار المتصفح على تشغيل الصوت */
        #audio-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 235, 238, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .overlay-box {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 112, 166, 0.5);
            padding: 25px 30px;
            border-radius: 25px;
            text-align: center;
            color: #d63384;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            animation: pulseBox 1.5s infinite alternate;
        }

        @keyframes pulseBox {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        .overlay-box h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .overlay-box p {
            font-size: 13.5px;
            margin: 0;
        }

        #effects-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .falling-item {
            position: absolute;
            top: -20px;
            user-select: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0.6; }
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 25px 20px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05),
                        inset 0 0 15px rgba(255, 255, 255, 0.3);
            text-align: center;
            max-width: 350px;
            width: 85%;
            z-index: 10;
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            animation: floatCard 4s ease-in-out infinite alternate;
        }

        @keyframes floatCard {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-8px) scale(1.02); }
        }

        .cake-container {
            font-size: 45px;
            margin-bottom: 8px;
            position: relative;
            display: inline-block;
        }

        .candles {
            font-size: 15px;
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            animation: glowFlicker 1.2s infinite alternate;
        }

        @keyframes glowFlicker {
            0% { opacity: 0.7; filter: drop-shadow(0 0 2px #ff99c8); transform: translateX(-50%) scale(1); }
            100% { opacity: 1; filter: drop-shadow(0 0 10px #ff4d94); transform: translateX(-50%) scale(1.15); }
        }

        h1 {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 22px;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #ff99c8, #ffd166, #c77dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255, 153, 200, 0.4);
        }

        .subtitle {
            font-size: 13.5px;
            color: #d63384;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .message-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(199, 125, 255, 0.35);
            border-radius: 15px;
            padding: 10px 14px;
            margin-bottom: 12px;
            box-shadow: inset 0 0 10px rgba(199, 125, 255, 0.15);
        }

        .message {
            color: #495057;
            font-size: 13px;
            line-height: 1.6;
            margin: 0;
        }

        #magic-btn {
            background: linear-gradient(135deg, #f72585 0%, #ff7eb3 100%);
            color: white;
            border: none;
            padding: 9px 18px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 126, 179, 0.5);
            transition: all 0.3s ease;
            margin-bottom: 8px;
        }

        #magic-btn:hover {
            transform: scale(1.06);
            background: linear-gradient(135deg, #c77dff 0%, #f72585 100%);
        }

        .secret-text {
            color: #c77dff;
            font-size: 12.5px;
            font-weight: bold;
            margin-top: 6px;
            min-height: 18px;
        }

        .heart-icon {
            font-size: 26px;
            animation: pulseHeart 1s infinite alternate;
            margin: 6px 0;
        }

        @keyframes pulseHeart {
            0% { transform: scale(1); filter: drop-shadow(0 0 4px #ff4d94); }
            100% { transform: scale(1.2); filter: drop-shadow(0 0 12px #ff4d94); }
        }

        .footer-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed rgba(0, 0, 0, 0.1);
            padding-top: 8px;
            margin-top: 8px;
        }

        .signature {
            font-size: 11px;
            color: #6c757d;
            text-align: right;
            line-height: 1.3;
        }

        .signature span {
            font-weight: bold;
            background: linear-gradient(90deg, #f72585, #c77dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 12.5px;
        }

        #music-toggle-btn {
            background: rgba(255, 255, 255, 0.4);
            color: #d63384;
            border: 1px solid rgba(255, 112, 166, 0.4);
            padding: 5px 10px;
            font-size: 10.5px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #music-toggle-btn:hover {
            background: rgba(255, 112, 166, 0.1);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- نافذة ترحيبية قصيرة تتطلب أول ضغطة لتشغيل الأغنية والألعاب النارية -->
    <div id="audio-overlay" onclick="startExperience()">
        <div class="overlay-box">
            <h2>✨ اضغطي هنا لفتح المفاجأة 🎁</h2>
            <p>انقري في أي مكان لبدء الاحتفال والموسيقى يا آيووش!</p>
        </div>
    </div>

    <!-- عنصر الصوت بأغنية عيد ميلاد حقيقية ومبهجة -->
    <audio id="bday-song" loop>
        <source src="https://actions.google.com/sounds/v1/holidays/birthday_song.ogg" type="audio/ogg">
       متصفحك لا يدعم تشغيل الصوت.
    </audio>



    <div id="effects-container"></div>

    <div class="card">
        <div class="cake-container">
            🎂<span class="candles">🕯️🕯️🕯️</span>
        </div>

        <h1>Happy Birthday Ayoosh! ✨</h1>
        <p class="subtitle">يا أجمل صديقة بالدنيا 🌸</p>
        
        <div class="message-box">
            <p class="message">
                كل عام وأنتِ بألف خير وسعادة يا أغلى آيووش! أتمنى لكِ سنة مليئة بالفرح وتحقيق كل أحلامك.💕
            </p>
        </div>

        <button id="magic-btn" onclick="triggerMagic(event)">اضغطي هنا لمفاجأة سحرية 🎁</button>
        <p id="secret-msg" class="secret-text"></p>

        <div class="heart-icon">💖</div>

        <div class="footer-area">
            <button id="music-toggle-btn" onclick="toggleMusic(event)">🔇 إيقاف</button>
            <div class="signature">
                تصميم وإهداء من:<br>
                <span>المهندسة أميمة</span> 💻🌹
            </div>
        </div>
    </div>

    <script>
        let isPlaying = false;

        // دالة بدء التجربة والصوت والألعاب النارية بمجرد النقر لأول مرة
        function startExperience() {
            const overlay = document.getElementById('audio-overlay');
            const song = document.getElementById('bday-song');
            
            // تشغيل الأغنية فوراً
            song.play().then(() => {
                isPlaying = true;
                document.getElementById('music-toggle-btn').innerHTML = "🔇 إيقاف";
            }).catch(err => {
                console.log("Audio play blocked");
            });

            // إخفاء نافذة التنبيه بسلاسة
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 500);

            // إطلاق الألعاب النارية وبدء تساقط القلوب والبالونات
            launchGrandFireworks();
            setInterval(createFallingItem, 220);
        }

        // دالة تشغيل وإيقاف الأغنية من الزر الصغير الجانبي
        function toggleMusic(event) {
            event.stopPropagation();
            const song = document.getElementById('bday-song');
            const btn = document.getElementById('music-toggle-btn');
            
            if (!isPlaying) {
                song.play().then(() => {
                    isPlaying = true;
                    btn.innerHTML = "🔇 إيقاف";
                });
            } else {
                song.pause();
                isPlaying = false;
                btn.innerHTML = "🎵 تشغيل";
            }
        }

        function launchGrandFireworks() {
            var duration = 4 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 40, spread: 360, ticks: 100, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }
                var particleCount = 70 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 200);
        }

        function createFallingItem() {
            const container = document.getElementById('effects-container');
            if (!container) return;

            const item = document.createElement('div');
            item.classList.add('falling-item');
            
            const symbols = ['🌸', '✨', '🎈', '🌟', '💖', '💫', '🌷', '🎉'];
            item.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            
            item.style.left = Math.random() * 100 + 'vw';
            item.style.fontSize = (Math.random() * 16 + 14) + 'px';
            
            const duration = Math.random() * 3 + 3.5;
            item.style.animationDuration = duration + 's';

            container.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, duration * 1000);
        }

        let clickCount = 0;
        function triggerMagic(event) {
            event.stopPropagation();
            clickCount++;
            const secretMsg = document.getElementById('secret-msg');
            
            confetti({
                particleCount: 150,
                spread: 90,
                origin: { y: 0.6 }
            });

            if (clickCount === 1) {
                secretMsg.innerHTML = "أنتِ أروع وأغلى إنسانة عرفتها! 💜";
            } else if (clickCount === 2) {
                secretMsg.innerHTML = "ربي يديم ضحكتك وصداقتنا للأبد يا رب! ✨";
            } else {
                secretMsg.innerHTML = "تستاهلي كل فرحة وسعادة بالكون! 🎉🥰";
                clickCount = 0;
            }
        }
    </script>
</body>
</html>
